name: release

# Releases are cut from the GitHub UI (Actions ▸ release ▸ pick a type ▸ Run), or
# by the release train through the same inputs of workflow_call. `plan` rehearses
# the release with no credential. `cut` runs in the protected `release`
# environment, which decides who can release and holds the key only `cut` reads.
# It pushes the version commit, the tags and the GitHub Release as the release App.
#
# The tag then runs this workflow again, and that run publishes the packages from
# the tag. Only the release App and admins can create a tag, so one approval
# covers the release, and a hotfix tag publishes its line the same way.
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version bump to cut
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: Bump & report only — no commit, tag, push, or release
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_type:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false
  push:
    tags: ["v*"]

run-name: "${{ github.event_name == 'push' && format('📦 publish {0}', github.ref_name) || format('🚀 release {0}{1}', inputs.release_type, inputs.dry_run && ' (dry-run)' || '') }}"

jobs:
  plan:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/publish-actions/release-core@v1.80.1
        with:
          # renovate: datasource=go depName=github.com/a-novel-kit/stack/cli
          cli_version: "1.38.0"
          release_type: ${{ inputs.release_type }}
          dry_run: "true"

  cut:
    needs: [plan]
    if: github.event_name != 'push' && !inputs.dry_run
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/publish-actions/release-core@v1.80.1
        with:
          # renovate: datasource=go depName=github.com/a-novel-kit/stack/cli
          cli_version: "1.38.0"
          release_type: ${{ inputs.release_type }}
          client_id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          app_private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

  # Publishes every package from the release tag.
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: a-novel-kit/workflows/publish-actions/npm@v1.80.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # Clears this repo's awaiting-release items off the board once the packages ship.
  archive:
    needs: [build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The Agent key is a secret of the governance environment, which no feature branch opens.
    environment:
      name: governance
      deployment: false
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/generic-actions/archive-board-items@v1.80.1
        with:
          client_id: ${{ vars.AGENT_BOT_CLIENT_ID }}
          app_private_key: ${{ secrets.AGENT_BOT_PRIVATE_KEY }}
          project_id: ${{ github.repository_owner == 'a-novel' && 'PVT_kwDOB9MxdM4BMh8r' || 'PVT_kwDOCy-nAM4BbtKH' }}
