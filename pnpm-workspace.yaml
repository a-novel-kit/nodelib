gitChecks: false
strictPeerDependencies: false
autoInstallPeers: true
dedupePeerDependents: true
packages:
  - packages/*
linkWorkspacePackages: true
peerDependencyRules:
  allowedVersions:
    "@trivago/prettier-plugin-sort-imports@6>prettier-plugin-svelte": "4"
overrides:
  "brace-expansion@>=2.0.0 <2.1.4": 2.1.4
  "esbuild@>=0.27.3 <0.28.1": 0.28.2
catalog:
  "@a-novel-kit/nodelib-config": "*"
  "@eslint/config-helpers": ^0.7.0
  "@eslint/js": ^10.0.1
  "@storybook/addon-vitest": ^10.5.8
  "@sveltejs/adapter-node": ^5.5.7
  "@sveltejs/kit": ^2.70.2
  "@trivago/prettier-plugin-sort-imports": ^6.0.2
  "@types/lodash-es": ^4.17.12
  "@types/node": ^24.13.3
  "@vitest/browser-playwright": ^4.1.10
  "@vitest/coverage-v8": 4.1.10
  eslint: ^10.0.2
  eslint-config-prettier: ^10.1.8
  estree-walker: 3.0.3
  globals: ^17.0.0
  jiti: ^2.6.1
  jsdom: ^30.0.0
  i18next: 26.3.6
  i18next-cli: 1.70.0
  i18next-cli-plugin-svelte: 2.4.1
  lodash-es: ^4.17.23
  prettier: ^3.7.4
  prettier-plugin-css-order: ^2.2.0
  prettier-plugin-packagejson: ^3.0.0
  prettier-plugin-svelte: ^4.1.1
  svelte: ^5.56.9
  typescript: ^6.0.0
  typescript-eslint: ^8.38.0
  vite: ^8.0.0
  vitest: ^4.0.0
  yaml: ^2.9.0
allowBuilds:
  "@swc/core": true
  esbuild: true
  msw: true
minimumReleaseAgeExclude:
  - svelte@5.55.8
  - "@typescript-eslint/eslint-plugin@8.59.4"
  - "@typescript-eslint/parser@8.59.4"
  - "@typescript-eslint/project-service@8.59.4"
  - "@typescript-eslint/scope-manager@8.59.4"
  - "@typescript-eslint/tsconfig-utils@8.59.4"
  - "@typescript-eslint/type-utils@8.59.4"
  - "@typescript-eslint/types@8.59.4"
  - "@typescript-eslint/typescript-estree@8.59.4"
  - "@typescript-eslint/utils@8.59.4"
  - "@typescript-eslint/visitor-keys@8.59.4"
  - typescript-eslint@8.59.4
  - prettier-plugin-svelte@4.0.0
  - eslint-plugin-storybook@10.4.1
  - storybook@10.4.1
  - "@sveltejs/kit@2.61.1"
  - eslint-plugin-svelte@3.18.0
  - eslint-plugin-svelte@3.19.0
  - svelte-eslint-parser@1.7.0
  - "@types/node@24.13.0"
