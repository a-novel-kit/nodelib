gitChecks: false
strictPeerDependencies: false
autoInstallPeers: true
dedupePeerDependents: true
packages:
  - packages/*
linkWorkspacePackages: true
peerDependencyRules:
  allowedVersions:
    "@trivago/prettier-plugin-sort-imports@6>prettier-plugin-svelte": "4"
overrides:
  "brace-expansion@>=2.0.0 <2.1.4": 2.1.7
  "esbuild@>=0.27.3 <0.28.1": 0.28.2
catalog:
  "@a-novel-kit/nodelib-config": "*"
  "@eslint/config-helpers": ^0.7.0
  "@eslint/js": ^10.0.1
  "@storybook/addon-vitest": ^10.5.8
  "@sveltejs/adapter-node": ^6.0.0
  "@sveltejs/kit": ^3.0.0
  "@trivago/prettier-plugin-sort-imports": ^6.0.2
  "@types/jsdom": ^30.0.0
  "@types/node": ^24.13.3
  "@vitest/browser-playwright": 5.0.5
  "@vitest/coverage-v8": 5.0.5
  eslint: ^10.0.2
  eslint-config-prettier: ^10.1.8
  estree-walker: 3.0.3
  globals: ^17.0.0
  jiti: ^2.6.1
  jsdom: ^30.0.0
  playwright: 1.64.1
  i18next: 26.4.7
  i18next-cli: 1.76.0
  i18next-cli-plugin-svelte: 2.4.1
  prettier: ^3.7.4
  prettier-plugin-css-order: ^2.2.0
  prettier-plugin-packagejson: ^3.0.0
  prettier-plugin-svelte: ^4.1.1
  svelte: ^5.56.9
  typescript: ^6.0.0
  typescript-eslint: ^8.38.0
  vite: ^8.0.0
  vitest: 5.0.5
  yaml: ^2.9.0
allowBuilds:
  "@swc/core": true
  esbuild: true
minimumReleaseAgeExclude:
  - "@a-novel-kit/*"
  - "@a-novel/*"
